name: getenergy-website

on:
  push:
    branches:
      - 'develop'
      - 'main'

jobs:
  create-production-image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Build and push the Docker image to ECR
    steps:
      - name: Check out the repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1-node16
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Log into the Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push docker image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: get-energy-website
          IMAGE_TAG: latest
        run: |
          docker build -t $REPOSITORY .
          docker tag $REPOSITORY:latest $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

  deploy-production-image:
    if: github.ref == 'refs/heads/main'
    name: Deploy the new Docker image to ECS
    runs-on: ubuntu-latest
    needs: create-production-image
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1-node16
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Update ECS service
        run: |
          aws ecs update-service --cluster get-energy-website --service get-energy-website --task-definition get-energy-website --force-new-deployment